<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">

<title>KAS Portfolio Editor</title>

<style>
*{box-sizing:border-box}

:root{
  --bg:#070707;
  --panel:#111;
  --panel2:#171717;
  --text:#f5f1e8;
  --muted:#999;
  --lime:#d9ff55;
  --gold:#d7b56d;
  --red:#ff6868;
  --line:#292929;
}

body{
  margin:0;
  background:var(--bg);
  color:var(--text);
  font-family:Arial,sans-serif;
}

.container{
  width:min(900px,calc(100% - 28px));
  margin:auto;
  padding:30px 0 80px;
}

header{
  padding:25px 0 35px;
  border-bottom:1px solid var(--line);
  margin-bottom:30px;
}

.eyebrow{
  color:var(--gold);
  font-size:11px;
  letter-spacing:.15em;
  font-weight:bold;
  text-transform:uppercase;
}

h1{
  font-size:42px;
  line-height:1;
  margin:12px 0;
}

h2{
  font-size:28px;
  margin:0 0 18px;
}

h3{
  margin:0 0 7px;
  font-size:19px;
}

.subtitle{
  color:var(--muted);
  line-height:1.6;
}

.section{
  margin:35px 0;
}

.toolbar{
  display:flex;
  justify-content:space-between;
  align-items:center;
  gap:15px;
  margin-bottom:15px;
}

button{
  border:0;
  cursor:pointer;
  font-family:inherit;
}

.add{
  background:var(--lime);
  color:#080808;
  padding:11px 16px;
  border-radius:100px;
  font-weight:bold;
  font-size:12px;
}

.save{
  width:100%;
  margin-top:35px;
  padding:17px;
  border-radius:12px;
  background:var(--lime);
  color:#080808;
  font-weight:bold;
  font-size:15px;
}

.card{
  background:var(--panel);
  border:1px solid var(--line);
  border-radius:15px;
  padding:20px;
  margin-bottom:14px;
}

.card-top{
  display:flex;
  justify-content:space-between;
  gap:15px;
  align-items:flex-start;
}

.number{
  color:var(--gold);
  font-size:11px;
  font-weight:bold;
  margin-bottom:5px;
}

.actions{
  display:flex;
  gap:7px;
}

.edit{
  background:#242424;
  color:white;
  padding:8px 12px;
  border-radius:8px;
  font-size:11px;
}

.delete{
  background:#321818;
  color:#ff8b8b;
  padding:8px 12px;
  border-radius:8px;
  font-size:11px;
}

.details{
  color:var(--muted);
  font-size:13px;
  line-height:1.6;
  margin-top:10px;
}

.form{
  display:none;
  margin-top:20px;
  padding-top:20px;
  border-top:1px solid var(--line);
}

.form.active{
  display:block;
}

label{
  display:block;
  color:#ccc;
  font-size:11px;
  font-weight:bold;
  margin:14px 0 6px;
  text-transform:uppercase;
  letter-spacing:.06em;
}

input,
textarea{
  width:100%;
  background:#080808;
  color:white;
  border:1px solid #333;
  border-radius:9px;
  padding:12px;
  font-size:14px;
  font-family:inherit;
  outline:none;
}

input:focus,
textarea:focus{
  border-color:var(--gold);
}

textarea{
  min-height:100px;
  resize:vertical;
}

.form-buttons{
  display:flex;
  gap:8px;
  margin-top:15px;
}

.form-save{
  background:var(--lime);
  color:#080808;
  padding:10px 15px;
  border-radius:8px;
  font-weight:bold;
}

.cancel{
  background:#292929;
  color:white;
  padding:10px 15px;
  border-radius:8px;
}

.empty{
  border:1px dashed #333;
  border-radius:12px;
  padding:25px;
  text-align:center;
  color:#777;
}

.notice{
  background:#15150f;
  border:1px solid #51472d;
  color:#cfc09b;
  border-radius:12px;
  padding:15px;
  font-size:12px;
  line-height:1.6;
}

.back{
  display:inline-block;
  color:var(--lime);
  font-size:12px;
  margin-bottom:20px;
}

@media(max-width:600px){
  h1{font-size:34px}

  .toolbar{
    align-items:flex-start;
  }

  .toolbar .add{
    white-space:nowrap;
  }

  .card-top{
    flex-direction:column;
  }

  .actions{
    width:100%;
  }

  .actions button{
    flex:1;
  }
}
</style>
</head>

<body>

<div class="container">

<a class="back" href="index.html">← Back to Portfolio</a>

<header>
  <div class="eyebrow">KAS / Portfolio Management</div>
  <h1>EDIT PORTFOLIO</h1>
  <p class="subtitle">
    Manage your projects and published articles without editing the website code.
  </p>
</header>

<div class="notice">
  Changes are saved in this browser. After saving, open your portfolio in the same browser to see the updated content.
</div>


<!-- =====================================================
     PROJECTS
===================================================== -->

<section class="section">

<div class="toolbar">
  <h2>Projects</h2>
  <button class="add" onclick="addProject()">＋ Add Project</button>
</div>

<div id="projects"></div>

</section>


<!-- =====================================================
     PUBLISHED ARTICLES
===================================================== -->

<section class="section">

<div class="toolbar">
  <h2>Published Articles</h2>
  <button class="add" onclick="addArticle()">＋ Add Article</button>
</div>

<div id="articles"></div>

</section>


<button class="save" onclick="saveAll()">
SAVE ALL CHANGES
</button>

</div>


<script>

const KEY = "KAS_PORTFOLIO_DATA_V1";


const fallback = {

name:"Kamrul Ahsan Shamim",

tagline:"Marketing × Branding × Creative Technology",

hero:"I turn marketing ideas into stories, campaigns and visual experiences that people remember.",

about:"I’m a marketing graduate interested in branding, digital marketing, advertising, creative strategy and AI-assisted content creation. I enjoy taking a business objective and turning it into a clear message, campaign idea or visual experience.",

email:"kamrul.shamim@northsouth.edu",

phone:"01400961461",

linkedin:"https://www.linkedin.com/in/kamrul-ahsan-shamim-a7841737a",

profile:"profile.jpg.PNG",

projects:[

{
title:"Product Advertising Portfolio",
category:"ADVERTISING · UGC · CREATIVE",
desc:"A collection of product advertising concepts, UGC campaigns, advertising posters, AI-assisted visuals and creative campaign executions.",
image:"product-advertising-display.PNG",
tags:"AI-assisted visual · UGC · Ad strategy",
link:"product-advertising.html"
},

{
title:"A/B Testing Visual Concept",
category:"DIGITAL MARKETING",
desc:"A LinkedIn marketing analysis and visual concept demonstrating test, compare, learn and scale thinking.",
image:"",
tags:"A/B testing · Content · Measurement",
link:""
},

{
title:"Gen Z & Rebranding",
category:"BRAND STRATEGY",
desc:"Brand strategy and consumer behavior thinking around authenticity, values, speed, creator-led trust and relevance.",
image:"",
tags:"Gen Z · Branding · Consumer behavior",
link:""
},

{
title:"Travel Visual Storytelling",
category:"VISUAL STORY",
desc:"Cinematic travel concepts using landscapes, people and journeys to build authentic visual narratives.",
image:"",
tags:"Storytelling · Photography · Content",
link:"travel.html"
}

],

articles:[

{
title:"Economic Shifts and Branding",
source:"The Financial Express",
date:"Nov 30, 2025",
image:"https://images.unsplash.com/photo-1554224155-6726b3ff858f?auto=format&fit=crop&w=500&q=80",
url:"https://today.thefinancialexpress.com.bd/print/economic-shifts-and-branding-1764426219"
},

{
title:"Power of Branding in Driving Growth",
source:"The Financial Express",
date:"Oct 6, 2025",
image:"https://images.unsplash.com/photo-1486406146926-c627a92ad1ab?auto=format&fit=crop&w=500&q=80",
url:"https://today.thefinancialexpress.com.bd/editorial/power-of-branding-in-driving-growth-1759675701?amp=true"
},

{
title:"Future of Digital Marketing",
source:"The Financial Express",
date:"Published article",
image:"https://images.unsplash.com/photo-1556761175-b413da4baf72?auto=format&fit=crop&w=500&q=80",
url:"https://today.thefinancialexpress.com.bd/editorial/future-of-digital-marketing-1769523175?amp=true"
},

{
title:"Gen Z Consumers and Changing Market",
source:"The Financial Express",
date:"Published article",
image:"https://images.unsplash.com/photo-1529156069898-49953e39b3ac?auto=format&fit=crop&w=500&q=80",
url:"https://today.thefinancialexpress.com.bd/public/print/gen-z-consumers-and-changing-market-1786804317"
},

{
title:"Unlocking Demographic Dividend",
source:"The Financial Express",
date:"Sep 16, 2025",
image:"https://images.unsplash.com/photo-1521737711867-e3b97375f902?auto=format&fit=crop&w=500&q=80",
url:"https://today.thefinancialexpress.com.bd/editorial/unlocking-demographic-dividend-1757948162?amp=true"
},

{
title:"Can Bangladesh Become a Startup Hub?",
source:"The Financial Express",
date:"Sep 14, 2025",
image:"https://images.unsplash.com/photo-1480714378408-67cf0d13bc1b?auto=format&fit=crop&w=500&q=80",
url:"https://today.thefinancialexpress.com.bd/editorial/can-bangladesh-become-a-startup-hub-1757861239?amp=true"
}

],

research:{
title:"The Credibility of Influencer Marketing and Its Impact on Consumer Purchase Decisions",
desc:"Exploratory quantitative research examining how influencer credibility factors can affect consumer purchase behavior.",
stats:"n = 103 · Cronbach’s Alpha = 0.676 · R² = 0.432",
finding:"Experience and influencer trustworthiness showed significant positive effects on purchase behavior, while perceived credibility and attractiveness were not statistically significant in the regression model."
}

};


function getData(){

try{

const saved = localStorage.getItem(KEY);

if(saved){

const parsed = JSON.parse(saved);

if(!parsed.articles){
parsed.articles = fallback.articles;
}

return parsed;

}

}catch(e){}

return JSON.parse(JSON.stringify(fallback));

}


let portfolio = getData();


/* =====================================================
   PROJECTS
===================================================== */

function renderProjects(){

const container =
document.getElementById("projects");

if(!portfolio.projects ||
portfolio.projects.length === 0){

container.innerHTML =
`<div class="empty">
No projects yet. Tap "+ Add Project".
</div>`;

return;

}

container.innerHTML =
portfolio.projects.map((p,i)=>`

<div class="card">

<div class="card-top">

<div>

<div class="number">
PROJECT ${String(i+1).padStart(2,"0")}
</div>

<h3>${escapeHTML(p.title)}</h3>

<div class="details">
${escapeHTML(p.category || "")}
<br>
${escapeHTML(p.desc || "")}
</div>

</div>

<div class="actions">

<button
class="edit"
onclick="toggleProject(${i})">
EDIT
</button>

<button
class="delete"
onclick="deleteProject(${i})">
DELETE
</button>

</div>

</div>


<div
id="project-form-${i}"
class="form">

<label>Project Title</label>

<input
id="p-title-${i}"
value="${escapeAttr(p.title)}"
>


<label>Category</label>

<input
id="p-category-${i}"
value="${escapeAttr(p.category)}"
>


<label>Description</label>

<textarea
id="p-desc-${i}"
>${escapeHTML(p.desc)}</textarea>


<label>Image File Name</label>

<input
id="p-image-${i}"
value="${escapeAttr(p.image || "")}"
placeholder="example.PNG"
>


<label>Tags</label>

<input
id="p-tags-${i}"
value="${escapeAttr(p.tags || "")}"
>


<label>Project Link</label>

<input
id="p-link-${i}"
value="${escapeAttr(p.link || "")}"
placeholder="example.html"
>


<div class="form-buttons">

<button
class="form-save"
onclick="saveProject(${i})">
SAVE PROJECT
</button>

<button
class="cancel"
onclick="toggleProject(${i})">
CANCEL
</button>

</div>

</div>

</div>

`).join("");

}


function addProject(){

portfolio.projects.push({

title:"New Project",

category:"CATEGORY",

desc:"Write a short description of this project.",

image:"",

tags:"",

link:""

});

renderProjects();

const index =
portfolio.projects.length - 1;

setTimeout(()=>{
toggleProject(index);
},50);

}


function toggleProject(i){

const form =
document.getElementById(
"project-form-" + i
);

if(form){

form.classList.toggle("active");

}

}


function saveProject(i){

const p =
portfolio.projects[i];

p.title =
document.getElementById(
"p-title-" + i
).value;

p.category =
document.getElementById(
"p-category-" + i
).value;

p.desc =
document.getElementById(
"p-desc-" + i
).value;

p.image =
document.getElementById(
"p-image-" + i
).value;

p.tags =
document.getElementById(
"p-tags-" + i
).value;

p.link =
document.getElementById(
"p-link-" + i
).value;

renderProjects();

saveLocal();

}


function deleteProject(i){

if(
confirm(
"Delete this project?"
)
){

portfolio.projects.splice(i,1);

renderProjects();

saveLocal();

}

}


/* =====================================================
   ARTICLES
===================================================== */

function renderArticles(){

const container =
document.getElementById("articles");

if(!portfolio.articles ||
portfolio.articles.length === 0){

container.innerHTML =
`<div class="empty">
No articles yet. Tap "+ Add Article".
</div>`;

return;

}

container.innerHTML =
portfolio.articles.map((a,i)=>`

<div class="card">

<div class="card-top">

<div>

<div class="number">
ARTICLE ${String(i+1).padStart(2,"0")}
</div>

<h3>${escapeHTML(a.title)}</h3>

<div class="details">
${escapeHTML(a.source || "")}
<br>
${escapeHTML(a.date || "")}
</div>

</div>

<div class="actions">

<button
class="edit"
onclick="toggleArticle(${i})">
EDIT
</button>

<button
class="delete"
onclick="deleteArticle(${i})">
DELETE
</button>

</div>

</div>


<div
id="article-form-${i}"
class="form">

<label>Article Title</label>

<input
id="a-title-${i}"
value="${escapeAttr(a.title)}"
>


<label>Publication / Source</label>

<input
id="a-source-${i}"
value="${escapeAttr(a.source)}"
>


<label>Publication Date</label>

<input
id="a-date-${i}"
value="${escapeAttr(a.date)}"
placeholder="Aug 28, 2026"
>


<label>Article Image URL</label>

<input
id="a-image-${i}"
value="${escapeAttr(a.image || "")}"
placeholder="https://..."
>


<label>Article URL</label>

<input
id="a-url-${i}"
value="${escapeAttr(a.url || "")}"
placeholder="https://..."
>


<div class="form-buttons">

<button
class="form-save"
onclick="saveArticle(${i})">
SAVE ARTICLE
</button>

<button
class="cancel"
onclick="toggleArticle(${i})">
CANCEL
</button>

</div>

</div>

</div>

`).join("");

}


function addArticle(){

portfolio.articles.push({

title:"New Published Article",

source:"The Financial Express",

date:"",

image:"",

url:""

});

renderArticles();

const index =
portfolio.articles.length - 1;

setTimeout(()=>{
toggleArticle(index);
},50);

}


function toggleArticle(i){

const form =
document.getElementById(
"article-form-" + i
);

if(form){

form.classList.toggle("active");

}

}


function saveArticle(i){

const a =
portfolio.articles[i];

a.title =
document.getElementById(
"a-title-" + i
).value;

a.source =
document.getElementById(
"a-source-" + i
).value;

a.date =
document.getElementById(
"a-date-" + i
).value;

a.image =
document.getElementById(
"a-image-" + i
).value;

a.url =
document.getElementById(
"a-url-" + i
).value;

renderArticles();

saveLocal();

}


function deleteArticle(i){

if(
confirm(
"Delete this published article?"
)
){

portfolio.articles.splice(i,1);

renderArticles();

saveLocal();

}

}


/* =====================================================
   SAVE
===================================================== */

function saveLocal(){

localStorage.setItem(
KEY,
JSON.stringify(portfolio)
);

}


function saveAll(){

saveLocal();

alert(
"Portfolio changes saved successfully."
);

}


/* =====================================================
   SECURITY / HTML ESCAPE
===================================================== */

function escapeHTML(value){

return String(value ?? "")
.replace(/&/g,"&amp;")
.replace(/</g,"&lt;")
.replace(/>/g,"&gt;")
.replace(/"/g,"&quot;")
.replace(/'/g,"&#039;");

}


function escapeAttr(value){

return escapeHTML(value);

}


/* =====================================================
   INITIALIZE
===================================================== */

renderProjects();

renderArticles();

</script>

</body>
</html>
