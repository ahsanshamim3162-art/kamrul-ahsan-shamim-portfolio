<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">

<title>KAS Portfolio Editor</title>

<style>
*{box-sizing:border-box}

body{
margin:0;
background:#080808;
color:#f5f1e8;
font-family:Arial,sans-serif;
line-height:1.5;
}

.container{
width:min(900px,calc(100% - 30px));
margin:auto;
padding:25px 0 80px;
}

h1{font-size:40px;margin:20px 0 5px}
h2{
margin-top:45px;
padding-bottom:12px;
border-bottom:1px solid #333;
}
h3{margin-top:0}

.subtitle{color:#999}

label{
display:block;
font-size:13px;
font-weight:bold;
color:#d7b56d;
margin:18px 0 7px;
}

input,textarea{
width:100%;
padding:13px;
border-radius:8px;
border:1px solid #333;
background:#111;
color:#fff;
font:inherit;
}

textarea{
min-height:110px;
resize:vertical;
}

.card{
background:#111;
border:1px solid #292929;
border-radius:14px;
padding:22px;
margin:18px 0;
}

button{
border:0;
border-radius:30px;
padding:12px 18px;
font-weight:bold;
cursor:pointer;
margin:8px 6px 8px 0;
}

.save{background:#d9ff55;color:#080808}
.add{background:#d7b56d;color:#080808}
.remove{background:#3a1818;color:#ff9999}
.secondary{background:#222;color:#fff}

.top-actions{
position:sticky;
top:0;
z-index:20;
background:#080808ee;
backdrop-filter:blur(12px);
padding:15px 0;
border-bottom:1px solid #222;
}

.status{
color:#9dff55;
font-size:13px;
margin-left:8px;
}

.small{
color:#888;
font-size:12px;
}

.notice{
background:#151515;
border:1px solid #333;
border-radius:12px;
padding:15px;
color:#aaa;
font-size:13px;
margin:20px 0;
}

hr{
border:0;
border-top:1px solid #292929;
margin:30px 0;
}
</style>
</head>

<body>

<div class="container">

<div class="top-actions">

<button class="save" onclick="savePortfolio()">
SAVE CHANGES
</button>

<button class="secondary" onclick="window.location.href='index.html'">
VIEW PORTFOLIO
</button>

<button class="secondary" onclick="resetPortfolio()">
RESET
</button>

<span id="status" class="status"></span>

</div>

<h1>Edit Portfolio</h1>

<p class="subtitle">
Manage your portfolio without editing the HTML code.
</p>

<div class="notice">
Changes are saved in this browser. Use SAVE CHANGES after making edits.
</div>


<!-- BASIC INFORMATION -->

<h2>01 / Basic Information</h2>

<label>Name</label>
<input id="name">

<label>Tagline</label>
<input id="tagline">

<label>Hero Text</label>
<textarea id="hero"></textarea>

<label>About Text</label>
<textarea id="about"></textarea>

<label>Email</label>
<input id="email">

<label>Phone</label>
<input id="phone">

<label>LinkedIn URL</label>
<input id="linkedin">

<label>Profile Image Filename</label>
<input id="profile">

<p class="small">
Example: profile.jpg.PNG
</p>


<!-- PROJECTS -->

<h2>02 / Selected Work</h2>

<div id="projects"></div>

<button class="add" onclick="addProject()">
+ ADD PROJECT
</button>


<!-- RESEARCH -->

<h2>03 / Research</h2>

<div class="card">

<label>Research Title</label>
<input id="researchTitle">

<label>Description</label>
<textarea id="researchDesc"></textarea>

<label>Statistics</label>
<input id="researchStats">

<label>Finding</label>
<textarea id="researchFinding"></textarea>

</div>


<!-- ARTICLES -->

<h2>04 / Published Articles</h2>

<div id="articles"></div>

<button class="add" onclick="addArticle()">
+ ADD PUBLISHED ARTICLE
</button>


<hr>

<button class="save" onclick="savePortfolio()">
SAVE ALL CHANGES
</button>

<button class="secondary" onclick="window.location.href='index.html'">
BACK TO PORTFOLIO
</button>

</div>


<script>

const KEY = "KAS_PORTFOLIO_DATA_V1";


const originalData = {

name:"Kamrul Ahsan Shamim",

tagline:"Marketing × Branding × Creative Technology",

hero:"I turn marketing ideas into stories, campaigns and visual experiences that people remember.",

about:"I’m a marketing graduate interested in branding, digital marketing, advertising, creative strategy and AI-assisted content creation. I enjoy taking a business objective and turning it into a clear message, campaign idea or visual experience.",

email:"kamrul.shamim@northsouth.edu",

phone:"01400961461",

linkedin:"https://www.linkedin.com/in/kamrul-ahsan-shamim-a7841737a",

profile:"profile.jpg.PNG",

projects:[

{
title:"Product Advertising Portfolio",
category:"ADVERTISING · UGC · CREATIVE",
desc:"A collection of product advertising concepts, UGC campaigns, advertising posters, AI-assisted visuals and creative campaign executions.",
image:"product-advertising-display.PNG",
tags:"AI-assisted visual · UGC · Ad strategy",
link:"product-advertising.html"
},

{
title:"A/B Testing Visual Concept",
category:"DIGITAL MARKETING",
desc:"A LinkedIn marketing analysis and visual concept demonstrating test, compare, learn and scale thinking.",
image:"",
tags:"A/B testing · Content · Measurement",
link:""
},

{
title:"Gen Z & Rebranding",
category:"BRAND STRATEGY",
desc:"Brand strategy and consumer behavior thinking around authenticity, values, speed, creator-led trust and relevance.",
image:"",
tags:"Gen Z · Branding · Consumer behavior",
link:""
},

{
title:"Travel Visual Storytelling",
category:"VISUAL STORY",
desc:"Cinematic travel concepts using landscapes, people and journeys to build authentic visual narratives.",
image:"",
tags:"Storytelling · Photography · Content",
link:"travel.html"
}

],

research:{

title:"The Credibility of Influencer Marketing and Its Impact on Consumer Purchase Decisions",

desc:"Exploratory quantitative research examining how influencer credibility factors can affect consumer purchase behavior.",

stats:"n = 103 · Cronbach’s Alpha = 0.676 · R² = 0.432",

finding:"Experience and influencer trustworthiness showed significant positive effects on purchase behavior, while perceived credibility and attractiveness were not statistically significant in the regression model."

},

articles:[

{
title:"Economic Shifts and Branding",
date:"Nov 30, 2025",
image:"https://images.unsplash.com/photo-1554224155-6726b3ff858f?auto=format&fit=crop&w=500&q=80",
url:"https://today.thefinancialexpress.com.bd/print/economic-shifts-and-branding-1764426219"
},

{
title:"Power of Branding in Driving Growth",
date:"Oct 6, 2025",
image:"https://images.unsplash.com/photo-1486406146926-c627a92ad1ab?auto=format&fit=crop&w=500&q=80",
url:"https://today.thefinancialexpress.com.bd/editorial/power-of-branding-in-driving-growth-1759675701?amp=true"
},

{
title:"Future of Digital Marketing",
date:"Published article",
image:"https://images.unsplash.com/photo-1556761175-b413da4baf72?auto=format&fit=crop&w=500&q=80",
url:"https://today.thefinancialexpress.com.bd/editorial/future-of-digital-marketing-1769523175?amp=true"
},

{
title:"Gen Z Consumers and Changing Market",
date:"Published article",
image:"https://images.unsplash.com/photo-1529156069898-49953e39b3ac?auto=format&fit=crop&w=500&q=80",
url:"https://today.thefinancialexpress.com.bd/public/print/gen-z-consumers-and-changing-market-1786804317"
},

{
title:"Unlocking Demographic Dividend",
date:"Sep 16, 2025",
image:"https://images.unsplash.com/photo-1521737711867-e3b97375f902?auto=format&fit=crop&w=500&q=80",
url:"https://today.thefinancialexpress.com.bd/editorial/unlocking-demographic-dividend-1757948162?amp=true"
},

{
title:"Can Bangladesh Become a Startup Hub?",
date:"Sep 14, 2025",
image:"https://images.unsplash.com/photo-1480714378408-67cf0d13bc1b?auto=format&fit=crop&w=500&q=80",
url:"https://today.thefinancialexpress.com.bd/editorial/can-bangladesh-become-a-startup-hub-1757861239?amp=true"
}

]

};


function clone(obj){
return JSON.parse(JSON.stringify(obj));
}


function loadData(){

try{

const saved=localStorage.getItem(KEY);

if(saved){

const parsed=JSON.parse(saved);

return{

...clone(originalData),
...parsed,

projects:
Array.isArray(parsed.projects)
? parsed.projects
: clone(originalData.projects),

articles:
Array.isArray(parsed.articles)
? parsed.articles
: clone(originalData.articles),

research:{
...clone(originalData.research),
...(parsed.research || {})
}

};

}

}catch(e){}

return clone(originalData);

}


let data=loadData();


function setValue(id,value){

const el=document.getElementById(id);

if(el){
el.value=value || "";
}

}


function loadBasic(){

setValue("name",data.name);
setValue("tagline",data.tagline);
setValue("hero",data.hero);
setValue("about",data.about);
setValue("email",data.email);
setValue("phone",data.phone);
setValue("linkedin",data.linkedin);
setValue("profile",data.profile);

}


function loadResearch(){

setValue("researchTitle",data.research.title);
setValue("researchDesc",data.research.desc);
setValue("researchStats",data.research.stats);
setValue("researchFinding",data.research.finding);

}


function escapeHTML(value){

return String(value || "")
.replace(/&/g,"&amp;")
.replace(/</g,"&lt;")
.replace(/>/g,"&gt;")
.replace(/"/g,"&quot;")
.replace(/'/g,"&#039;");

}


function renderProjects(){

const container=document.getElementById("projects");

container.innerHTML="";

data.projects.forEach((project,index)=>{

const card=document.createElement("div");

card.className="card";

card.innerHTML=`

<h3>Project ${index+1}</h3>

<label>Project Title</label>
<input class="project-title"
value="${escapeHTML(project.title)}">

<label>Category</label>
<input class="project-category"
value="${escapeHTML(project.category)}">

<label>Description</label>
<textarea class="project-desc">${escapeHTML(project.desc)}</textarea>

<label>Image Filename</label>
<input class="project-image"
value="${escapeHTML(project.image)}">

<p class="small">
Use a filename that already exists in your GitHub repository.
Example: product-advertising-display.PNG
</p>

<label>Tags</label>
<input class="project-tags"
value="${escapeHTML(project.tags)}">

<label>Project Link</label>
<input class="project-link"
value="${escapeHTML(project.link)}">

<button class="remove"
onclick="removeProject(${index})">
REMOVE PROJECT
</button>

`;

container.appendChild(card);

});

}


function addProject(){

data.projects.push({

title:"New Project",
category:"CATEGORY",
desc:"Project description",
image:"",
tags:"",
link:""

});

renderProjects();

}


function removeProject(index){

if(!confirm("Remove this project?")) return;

data.projects.splice(index,1);

renderProjects();

}


function renderArticles(){

const container=document.getElementById("articles");

container.innerHTML="";

data.articles.forEach((article,index)=>{

const card=document.createElement("div");

card.className="card";

card.innerHTML=`

<h3>Article ${index+1}</h3>

<label>Article Title</label>
<input class="article-title"
value="${escapeHTML(article.title)}">

<label>Publication Date</label>
<input class="article-date"
value="${escapeHTML(article.date)}">

<label>Article Image URL</label>
<input class="article-image"
value="${escapeHTML(article.image)}">

<label>Article URL</label>
<input class="article-url"
value="${escapeHTML(article.url)}">

<button class="remove"
onclick="removeArticle(${index})">
REMOVE ARTICLE
</button>

`;

container.appendChild(card);

});

}


function addArticle(){

data.articles.push({

title:"New Published Article",
date:"",
image:"",
url:""

});

renderArticles();

}


function removeArticle(index){

if(!confirm("Remove this article?")) return;

data.articles.splice(index,1);

renderArticles();

}


function collectData(){

data.name=document.getElementById("name").value.trim();

data.tagline=document.getElementById("tagline").value.trim();

data.hero=document.getElementById("hero").value.trim();

data.about=document.getElementById("about").value.trim();

data.email=document.getElementById("email").value.trim();

data.phone=document.getElementById("phone").value.trim();

data.linkedin=document.getElementById("linkedin").value.trim();

data.profile=document.getElementById("profile").value.trim();


data.projects=
Array.from(
document.querySelectorAll("#projects .card")
).map(card=>({

title:card.querySelector(".project-title").value.trim(),

category:card.querySelector(".project-category").value.trim(),

desc:card.querySelector(".project-desc").value.trim(),

image:card.querySelector(".project-image").value.trim(),

tags:card.querySelector(".project-tags").value.trim(),

link:card.querySelector(".project-link").value.trim()

}));


data.research={

title:document.getElementById("researchTitle").value.trim(),

desc:document.getElementById("researchDesc").value.trim(),

stats:document.getElementById("researchStats").value.trim(),

finding:document.getElementById("researchFinding").value.trim()

};


data.articles=
Array.from(
document.querySelectorAll("#articles .card")
).map(card=>({

title:card.querySelector(".article-title").value.trim(),

date:card.querySelector(".article-date").value.trim(),

image:card.querySelector(".article-image").value.trim(),

url:card.querySelector(".article-url").value.trim()

}));

}


function savePortfolio(){

collectData();

localStorage.setItem(
KEY,
JSON.stringify(data)
);

const status=document.getElementById("status");

status.textContent="✓ Changes saved";

setTimeout(()=>{
status.textContent="";
},3000);

}


function resetPortfolio(){

if(!confirm(
"Reset everything to the original portfolio content?"
)) return;

data=clone(originalData);

localStorage.setItem(
KEY,
JSON.stringify(data)
);

loadBasic();
loadResearch();
renderProjects();
renderArticles();

document.getElementById("status").textContent="✓ Reset";

}


loadBasic();
loadResearch();
renderProjects();
renderArticles();

</script>

</body>
</html>
