<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">

<title>KAS Portfolio Editor</title>

<style>
*{box-sizing:border-box}

body{
margin:0;
background:#070707;
color:#f5f1e8;
font-family:Arial,sans-serif;
}

.container{
width:min(900px,calc(100% - 28px));
margin:auto;
padding:30px 0 80px;
}

h1{
font-size:38px;
margin:10px 0;
}

h2{
font-size:27px;
margin:0;
}

h3{
margin:0 0 8px;
font-size:18px;
}

.eyebrow{
color:#d7b56d;
font-size:11px;
font-weight:bold;
letter-spacing:.15em;
text-transform:uppercase;
}

.muted{
color:#999;
line-height:1.6;
}

header{
border-bottom:1px solid #292929;
padding:20px 0 30px;
margin-bottom:30px;
}

.section{
margin:40px 0;
}

.toolbar{
display:flex;
justify-content:space-between;
align-items:center;
gap:15px;
margin-bottom:16px;
}

.card{
background:#111;
border:1px solid #292929;
border-radius:15px;
padding:20px;
margin-bottom:14px;
}

.cardtop{
display:flex;
justify-content:space-between;
gap:15px;
}

.number{
color:#d7b56d;
font-size:10px;
font-weight:bold;
margin-bottom:5px;
}

.details{
color:#999;
font-size:13px;
line-height:1.6;
}

.actions{
display:flex;
gap:7px;
}

button{
font-family:inherit;
cursor:pointer;
border:0;
}

.add{
background:#d9ff55;
color:#080808;
padding:11px 15px;
border-radius:100px;
font-size:12px;
font-weight:bold;
}

.edit{
background:#292929;
color:white;
padding:9px 13px;
border-radius:8px;
font-size:11px;
}

.delete{
background:#351919;
color:#ff7777;
padding:9px 13px;
border-radius:8px;
font-size:11px;
}

.form{
display:none;
border-top:1px solid #292929;
margin-top:18px;
padding-top:18px;
}

.form.active{
display:block;
}

label{
display:block;
font-size:10px;
font-weight:bold;
letter-spacing:.08em;
color:#bbb;
margin:14px 0 6px;
text-transform:uppercase;
}

input,textarea{
width:100%;
background:#080808;
border:1px solid #333;
border-radius:9px;
color:white;
padding:12px;
font-family:inherit;
font-size:14px;
outline:none;
}

textarea{
min-height:100px;
resize:vertical;
}

input:focus,textarea:focus{
border-color:#d7b56d;
}

.formbuttons{
display:flex;
gap:8px;
margin-top:15px;
}

.saveitem{
background:#d9ff55;
color:#080808;
padding:10px 15px;
border-radius:8px;
font-weight:bold;
}

.cancel{
background:#292929;
color:white;
padding:10px 15px;
border-radius:8px;
}

.saveall{
width:100%;
background:#d9ff55;
color:#080808;
padding:17px;
border-radius:12px;
font-weight:bold;
font-size:15px;
margin-top:20px;
}

.empty{
border:1px dashed #333;
padding:25px;
border-radius:12px;
text-align:center;
color:#777;
}

.back{
display:inline-block;
color:#d9ff55;
font-size:12px;
margin-bottom:20px;
}

@media(max-width:600px){

.cardtop{
flex-direction:column;
}

.actions{
width:100%;
}

.actions button{
flex:1;
}

.toolbar{
align-items:flex-start;
}

h1{
font-size:32px;
}
}
</style>
</head>

<body>

<div class="container">

<a href="index.html" class="back">← Back to Portfolio</a>

<header>
<div class="eyebrow">KAS / Portfolio Management</div>

<h1>EDIT PORTFOLIO</h1>

<p class="muted">
Add and manage projects and published articles.
</p>
</header>


<!-- PROJECTS -->

<section class="section">

<div class="toolbar">

<h2>Projects</h2>

<button class="add" onclick="addProject()">
＋ Add Project
</button>

</div>

<div id="projects"></div>

</section>


<!-- ARTICLES -->

<section class="section">

<div class="toolbar">

<h2>Published Articles</h2>

<button class="add" onclick="addArticle()">
＋ Add Article
</button>

</div>

<div id="articles"></div>

</section>


<button class="saveall" onclick="saveAll()">
SAVE ALL CHANGES
</button>

</div>


<script>

const KEY="KAS_PORTFOLIO_DATA_V1";


const defaultData={

name:"Kamrul Ahsan Shamim",

hero:"I turn marketing ideas into stories, campaigns and visual experiences that people remember.",

about:"I’m a marketing graduate interested in branding, digital marketing, advertising, creative strategy and AI-assisted content creation.",

email:"kamrul.shamim@northsouth.edu",

phone:"01400961461",

linkedin:"https://www.linkedin.com/in/kamrul-ahsan-shamim-a7841737a",

profile:"profile.jpg.PNG",


projects:[

{
title:"Product Advertising Portfolio",
category:"ADVERTISING · UGC · CREATIVE",
desc:"A collection of product advertising concepts, UGC campaigns, advertising posters, AI-assisted visuals and creative campaign executions.",
image:"product-advertising-display.PNG",
tags:"AI-assisted visual · UGC · Ad strategy",
link:"product-advertising.html"
},

{
title:"A/B Testing Visual Concept",
category:"DIGITAL MARKETING",
desc:"A LinkedIn marketing analysis and visual concept demonstrating test, compare, learn and scale thinking.",
image:"",
tags:"A/B testing · Content · Measurement",
link:""
},

{
title:"Gen Z & Rebranding",
category:"BRAND STRATEGY",
desc:"Brand strategy and consumer behavior thinking around authenticity, values, speed, creator-led trust and relevance.",
image:"",
tags:"Gen Z · Branding · Consumer behavior",
link:""
},

{
title:"Travel Visual Storytelling",
category:"VISUAL STORY",
desc:"Cinematic travel concepts using landscapes, people and journeys to build authentic visual narratives.",
image:"",
tags:"Storytelling · Photography · Content",
link:"travel.html"
}

],


articles:[

{
title:"Economic Shifts and Branding",
source:"The Financial Express",
date:"Nov 30, 2025",
image:"https://images.unsplash.com/photo-1554224155-6726b3ff858f?auto=format&fit=crop&w=500&q=80",
url:"https://today.thefinancialexpress.com.bd/print/economic-shifts-and-branding-1764426219"
},

{
title:"Power of Branding in Driving Growth",
source:"The Financial Express",
date:"Oct 6, 2025",
image:"https://images.unsplash.com/photo-1486406146926-c627a92ad1ab?auto=format&fit=crop&w=500&q=80",
url:"https://today.thefinancialexpress.com.bd/editorial/power-of-branding-in-driving-growth-1759675701?amp=true"
},

{
title:"Future of Digital Marketing",
source:"The Financial Express",
date:"Published article",
image:"https://images.unsplash.com/photo-1556761175-b413da4baf72?auto=format&fit=crop&w=500&q=80",
url:"https://today.thefinancialexpress.com.bd/editorial/future-of-digital-marketing-1769523175?amp=true"
},

{
title:"Gen Z Consumers and Changing Market",
source:"The Financial Express",
date:"Published article",
image:"https://images.unsplash.com/photo-1529156069898-49953e39b3ac?auto=format&fit=crop&w=500&q=80",
url:"https://today.thefinancialexpress.com.bd/public/print/gen-z-consumers-and-changing-market-1786804317"
},

{
title:"Unlocking Demographic Dividend",
source:"The Financial Express",
date:"Sep 16, 2025",
image:"https://images.unsplash.com/photo-1521737711867-e3b97375f902?auto=format&fit=crop&w=500&q=80",
url:"https://today.thefinancialexpress.com.bd/editorial/unlocking-demographic-dividend-1757948162?amp=true"
},

{
title:"Can Bangladesh Become a Startup Hub?",
source:"The Financial Express",
date:"Sep 14, 2025",
image:"https://images.unsplash.com/photo-1480714378408-67cf0d13bc1b?auto=format&fit=crop&w=500&q=80",
url:"https://today.thefinancialexpress.com.bd/editorial/can-bangladesh-become-a-startup-hub-1757861239?amp=true"
}

]

};


function loadData(){

try{

const saved=localStorage.getItem(KEY);

if(saved){

const data=JSON.parse(saved);

if(!data.projects)
data.projects=[];

if(!data.articles)
data.articles=[];

return data;

}

}catch(e){}

return JSON.parse(JSON.stringify(defaultData));

}


let data=loadData();


function saveData(){

localStorage.setItem(
KEY,
JSON.stringify(data)
);

}


function esc(value){

return String(value||"")
.replace(/&/g,"&amp;")
.replace(/</g,"&lt;")
.replace(/>/g,"&gt;")
.replace(/"/g,"&quot;")
.replace(/'/g,"&#039;");

}


/* PROJECTS */

function renderProjects(){

const box=document.getElementById("projects");

if(data.projects.length===0){

box.innerHTML=
'<div class="empty">No projects. Tap ＋ Add Project.</div>';

return;

}


box.innerHTML=data.projects.map((p,i)=>`

<div class="card">

<div class="cardtop">

<div>

<div class="number">
PROJECT ${String(i+1).padStart(2,"0")}
</div>

<h3>${esc(p.title)}</h3>

<div class="details">

${esc(p.category)}

<br>

${esc(p.desc)}

</div>

</div>


<div class="actions">

<button
class="edit"
onclick="editProject(${i})">
EDIT
</button>

<button
class="delete"
onclick="deleteProject(${i})">
DELETE
</button>

</div>

</div>


<div
id="projectForm${i}"
class="form">

<label>Project Title</label>

<input
id="ptitle${i}"
value="${esc(p.title)}">


<label>Category</label>

<input
id="pcategory${i}"
value="${esc(p.category)}">


<label>Description</label>

<textarea
id="pdesc${i}">${esc(p.desc)}</textarea>


<label>Image File Name</label>

<input
id="pimage${i}"
value="${esc(p.image)}"
placeholder="example.PNG">


<label>Tags</label>

<input
id="ptags${i}"
value="${esc(p.tags)}">


<label>Project Link</label>

<input
id="plink${i}"
value="${esc(p.link)}"
placeholder="example.html">


<div class="formbuttons">

<button
class="saveitem"
onclick="saveProject(${i})">
SAVE PROJECT
</button>

<button
class="cancel"
onclick="editProject(${i})">
CANCEL
</button>

</div>

</div>

</div>

`).join("");

}


function addProject(){

data.projects.push({

title:"New Project",
category:"CATEGORY",
desc:"",
image:"",
tags:"",
link:""

});

renderProjects();

editProject(data.projects.length-1);

}


function editProject(i){

const form=document.getElementById(
"projectForm"+i
);

if(form)
form.classList.toggle("active");

}


function saveProject(i){

const p=data.projects[i];

p.title=document.getElementById("ptitle"+i).value;

p.category=document.getElementById("pcategory"+i).value;

p.desc=document.getElementById("pdesc"+i).value;

p.image=document.getElementById("pimage"+i).value;

p.tags=document.getElementById("ptags"+i).value;

p.link=document.getElementById("plink"+i).value;

saveData();

renderProjects();

alert("Project saved.");

}


function deleteProject(i){

if(confirm("Delete this project?")){

data.projects.splice(i,1);

saveData();

renderProjects();

}

}


/* ARTICLES */

function renderArticles(){

const box=document.getElementById("articles");

if(data.articles.length===0){

box.innerHTML=
'<div class="empty">No articles. Tap ＋ Add Article.</div>';

return;

}


box.innerHTML=data.articles.map((a,i)=>`

<div class="card">

<div class="cardtop">

<div>

<div class="number">
ARTICLE ${String(i+1).padStart(2,"0")}
</div>

<h3>${esc(a.title)}</h3>

<div class="details">

${esc(a.source)}

<br>

${esc(a.date)}

</div>

</div>


<div class="actions">

<button
class="edit"
onclick="editArticle(${i})">
EDIT
</button>

<button
class="delete"
onclick="deleteArticle(${i})">
DELETE
</button>

</div>

</div>


<div
id="articleForm${i}"
class="form">

<label>Article Title</label>

<input
id="atitle${i}"
value="${esc(a.title)}">


<label>Publication / Source</label>

<input
id="asource${i}"
value="${esc(a.source)}">


<label>Publication Date</label>

<input
id="adate${i}"
value="${esc(a.date)}"
placeholder="Aug 28, 2026">


<label>Article Image URL</label>

<input
id="aimage${i}"
value="${esc(a.image)}"
placeholder="https://...">


<label>Article URL</label>

<input
id="aurl${i}"
value="${esc(a.url)}"
placeholder="https://...">


<div class="formbuttons">

<button
class="saveitem"
onclick="saveArticle(${i})">
SAVE ARTICLE
</button>

<button
class="cancel"
onclick="editArticle(${i})">
CANCEL
</button>

</div>

</div>

</div>

`).join("");

}


function addArticle(){

data.articles.push({

title:"New Published Article",
source:"The Financial Express",
date:"",
image:"",
url:""

});

renderArticles();

editArticle(data.articles.length-1);

}


function editArticle(i){

const form=document.getElementById(
"articleForm"+i
);

if(form)
form.classList.toggle("active");

}


function saveArticle(i){

const a=data.articles[i];

a.title=document.getElementById("atitle"+i).value;

a.source=document.getElementById("asource"+i).value;

a.date=document.getElementById("adate"+i).value;

a.image=document.getElementById("aimage"+i).value;

a.url=document.getElementById("aurl"+i).value;

saveData();

renderArticles();

alert("Article saved.");

}


function deleteArticle(i){

if(confirm("Delete this article?")){

data.articles.splice(i,1);

saveData();

renderArticles();

}

}


function saveAll(){

saveData();

alert(
"All portfolio changes have been saved."
);

}


/* START */

renderProjects();

renderArticles();

</script>

</body>
</html>
