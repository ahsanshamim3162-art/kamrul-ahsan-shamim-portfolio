<!doctype html>
<html lang="en">

<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">

<title>KAS Portfolio Editor</title>

<style>

*{
box-sizing:border-box;
}

body{
margin:0;
background:#080808;
color:#f5f1e8;
font-family:Arial,sans-serif;
line-height:1.5;
}

.container{
width:min(900px,calc(100% - 30px));
margin:auto;
padding:35px 0 80px;
}

h1,h2,h3{
font-family:Arial,sans-serif;
}

h1{
font-size:42px;
margin-bottom:8px;
}

h2{
margin-top:45px;
padding-bottom:12px;
border-bottom:1px solid #333;
}

.subtitle{
color:#999;
margin-bottom:35px;
}

label{
display:block;
font-size:13px;
font-weight:bold;
color:#d7b56d;
margin:18px 0 7px;
}

input,
textarea{
width:100%;
padding:13px;
border-radius:8px;
border:1px solid #333;
background:#111;
color:#fff;
font:inherit;
}

textarea{
min-height:110px;
resize:vertical;
}

.card{
background:#111;
border:1px solid #292929;
border-radius:14px;
padding:22px;
margin:18px 0;
}

.card h3{
margin-top:0;
}

button{
border:0;
border-radius:30px;
padding:12px 18px;
font-weight:bold;
cursor:pointer;
margin:8px 6px 8px 0;
}

.save{
background:#d9ff55;
color:#080808;
}

.add{
background:#d7b56d;
color:#080808;
}

.remove{
background:#3a1818;
color:#ff9999;
}

.secondary{
background:#222;
color:#fff;
}

.top-actions{
position:sticky;
top:0;
z-index:20;
background:#080808ee;
backdrop-filter:blur(12px);
padding:15px 0;
border-bottom:1px solid #222;
}

.status{
display:inline-block;
color:#9dff55;
font-size:13px;
margin-left:8px;
}

.small{
color:#888;
font-size:12px;
}

hr{
border:0;
border-top:1px solid #292929;
margin:30px 0;
}

</style>
</head>

<body>

<div class="container">

<div class="top-actions">

<button class="save" onclick="savePortfolio()">
SAVE CHANGES
</button>

<button class="secondary" onclick="window.location.href='index.html'">
VIEW PORTFOLIO
</button>

<button class="secondary" onclick="resetPortfolio()">
RESET
</button>

<span id="status" class="status"></span>

</div>


<h1>Edit Portfolio</h1>

<p class="subtitle">
Update your portfolio without editing code.
</p>


<!-- BASIC INFORMATION -->

<h2>01 / Basic Information</h2>

<label>Name</label>
<input id="name">

<label>Tagline</label>
<input id="tagline">

<label>Hero Text</label>
<textarea id="hero"></textarea>

<label>About Text</label>
<textarea id="about"></textarea>

<label>Email</label>
<input id="email">

<label>Phone</label>
<input id="phone">

<label>LinkedIn URL</label>
<input id="linkedin">

<label>Profile Image Filename</label>
<input id="profile">

<p class="small">
Example: profile.jpg.PNG
</p>


<!-- PROJECTS -->

<h2>02 / Selected Work</h2>

<div id="projects"></div>

<button class="add" onclick="addProject()">
+ ADD PROJECT
</button>


<!-- RESEARCH -->

<h2>03 / Research</h2>

<div class="card">

<label>Research Title</label>
<input id="researchTitle">

<label>Description</label>
<textarea id="researchDesc"></textarea>

<label>Statistics</label>
<input id="researchStats">

<label>Finding</label>
<textarea id="researchFinding"></textarea>

</div>


<!-- ARTICLES -->

<h2>04 / Published Articles</h2>

<div id="articles"></div>

<button class="add" onclick="addArticle()">
+ ADD PUBLISHED ARTICLE
</button>


<hr>

<button class="save" onclick="savePortfolio()">
SAVE ALL CHANGES
</button>

<button class="secondary" onclick="window.location.href='index.html'">
BACK TO PORTFOLIO
</button>

</div>


<script>

const KEY = "KAS_PORTFOLIO_DATA_V1";


const originalData = {

name:"Kamrul Ahsan Shamim",

tagline:"Marketing × Branding × Creative Technology",

hero:"I turn marketing ideas into stories, campaigns and visual experiences that people remember.",

about:"I’m a marketing graduate interested in branding, digital marketing, advertising, creative strategy and AI-assisted content creation. I enjoy taking a business objective and turning it into a clear message, campaign idea or visual experience.",

email:"kamrul.shamim@northsouth.edu",

phone:"01400961461",

linkedin:"https://www.linkedin.com/in/kamrul-ahsan-shamim-a7841737a",

profile:"profile.jpg.PNG",

projects:[

{
title:"Product Advertising Portfolio",
category:"ADVERTISING · UGC · CREATIVE",
desc:"A collection of product advertising concepts, UGC campaigns, advertising posters, AI-assisted visuals and creative campaign executions.",
image:"product-advertising-display.PNG",
tags:"AI-assisted visual · UGC · Ad strategy",
link:"product-advertising.html"
},

{
title:"A/B Testing Visual Concept",
category:"DIGITAL MARKETING",
desc:"A LinkedIn marketing analysis and visual concept demonstrating test, compare, learn and scale thinking.",
image:"",
tags:"A/B testing · Content · Measurement",
link:""
},

{
title:"Gen Z & Rebranding",
category:"BRAND STRATEGY",
desc:"Brand strategy and consumer behavior thinking around authenticity, values, speed, creator-led trust and relevance.",
image:"",
tags:"Gen Z · Branding · Consumer behavior",
link:""
},

{
title:"Travel Visual Storytelling",
category:"VISUAL STORY",
desc:"Cinematic travel concepts using landscapes, people and journeys to build authentic visual narratives.",
image:"",
tags:"Storytelling · Photography · Content",
link:"travel.html"
}

],

research:{

title:"The Credibility of Influencer Marketing and Its Impact on Consumer Purchase Decisions",

desc:"Exploratory quantitative research examining how influencer credibility factors can affect consumer purchase behavior.",

stats:"n = 103 · Cronbach’s Alpha = 0.676 · R² = 0.432",

finding:"Experience and influencer trustworthiness showed significant positive effects on purchase behavior, while perceived credibility and attractiveness were not statistically significant in the regression model."

},

articles:[

{
title:"Economic Shifts and Branding",
date:"Nov 30, 2025",
image:"https://images.unsplash.com/photo-1554224155-6726b3ff858f?auto=format&fit=crop&w=500&q=80",
url:"https://today.thefinancialexpress.com.bd/print/economic-shifts-and-branding-1764426219"
},

{
title:"Power of Branding in Driving Growth",
date:"Oct 6, 2025",
image:"https://images.unsplash.com/photo-1486406146926-c627a92ad1ab?auto=format&fit=crop&w=500&q=80",
url:"https://today.thefinancialexpress.com.bd/editorial/power-of-branding-in-driving-growth-1759675701?amp=true"
},

{
title:"Future of Digital Marketing",
date:"Published article",
image:"https://images.unsplash.com/photo-1556761175-b413da4baf72?auto=format&fit=crop&w=500&q=80",
url:"https://today.thefinancialexpress.com.bd/editorial/future-of-digital-marketing-1769523175?amp=true"
},

{
title:"Gen Z Consumers and Changing Market",
date:"Published article",
image:"https://images.unsplash.com/photo-1529156069898-49953e39b3ac?auto=format&fit=crop&w=500&q=80",
url:"https://today.thefinancialexpress.com.bd/public/print/gen-z-consumers-and-changing-market-1786804317"
},

{
title:"Unlocking Demographic Dividend",
date:"Sep 16, 2025",
image:"https://images.unsplash.com/photo-1521737711867-e3b97375f902?auto=format&fit=crop&w=500&q=80",
url:"https://today.thefinancialexpress.com.bd/editorial/unlocking-demographic-dividend-1757948162?amp=true"
},

{
title:"Can Bangladesh Become a Startup Hub?",
date:"Sep 14, 2025",
image:"https://images.unsplash.com/photo-1480714378408-67cf0d13bc1b?auto=format&fit=crop&w=500&q=80",
url:"https://today.thefinancialexpress.com.bd/editorial/can-bangladesh-become-a-startup-hub-1757861239?amp=true"
}

]

};


/* LOAD */

function loadData(){

try{

const saved =
localStorage.getItem(KEY);

if(saved){

return mergeData(
originalData,
JSON.parse(saved)
);

}

}catch(e){}

return JSON.parse(
JSON.stringify(originalData)
);

}


/* MERGE */

function mergeData(base,saved){

return {

...base,
...saved,

projects:
saved.projects || base.projects,

articles:
saved.articles || base.articles,

research:
{
...base.research,
...(saved.research || {})
}

};

}


let data = loadData();


/* BASIC FIELDS */

function loadBasic(){

document.getElementById("name").value =
data.name || "";

document.getElementById("tagline").value =
data.tagline || "";

document.getElementById("hero").value =
data.hero || "";

document.getElementById("about").value =
data.about || "";

document.getElementById("email").value =
data.email || "";

document.getElementById("phone").value =
data.phone || "";

document.getElementById("linkedin").value =
data.linkedin || "";

document.getElementById("profile").value =
data.profile || "";

}


/* PROJECTS */

function renderProjects(){

const container =
document.getElementById("projects");

container.innerHTML = "";

data.projects.forEach((project,index)=>{

const card =
document.createElement("div");

card.className = "card";

card.innerHTML = `

<h3>
Project ${index + 1}
</h3>

<label>Project Title</label>

<input
class="project-title"
value="${escapeHTML(project.title || "")}"
>

<label>Category</label>

<input
class="project-category"
value="${escapeHTML(project.category || "")}"
>

<label>Description</label>

<textarea
class="project-desc"
>${escapeHTML(project.desc || "")}</textarea>

<label>Image Filename</label>

<input
class="project-image"
value="${escapeHTML(project.image || "")}"
>

<label>Tags</label>

<input
class="project-tags"
value="${escapeHTML(project.tags || "")}"
>

<label>Project Link</label>

<input
class="project-link"
value="${escapeHTML(project.link || "")}"
>

<button
class="remove"
onclick="removeProject(${index})">
REMOVE PROJECT
</button>

`;

container.appendChild(card);

});

}


/* ADD PROJECT */

function addProject(){

data.projects.push({

title:"New Project",

category:"CATEGORY",

desc:"Project description",

image:"",

tags:"",

link:""

});

renderProjects();

window.scrollTo({
top:document.body.scrollHeight,
behavior:"smooth"
});

}


/* REMOVE PROJECT */

function removeProject(index){

if(!confirm("Remove this project?")) return;

data.projects.splice(index,1);

renderProjects();

}


/* ARTICLES */

function renderArticles(){

const container =
document.getElementById("articles");

container.innerHTML = "";

data.articles.forEach((article,index)=>{

const card =
document.createElement("div");

card.className = "card";

card.innerHTML = `

<h3>
Article ${index + 1}
</h3>

<label>Article Title</label>

<input
class="article-title"
value="${escapeHTML(article.title || "")}"
>

<label>Publication Date</label>

<input
class="article-date"
value="${escapeHTML(article.date || "")}"
>

<label>Article Image URL</label>

<input
class="article-image"
value="${escapeHTML(article.image || "")}"
>

<label>Article URL</label>

<input
class="article-url"
value="${escapeHTML(article.url || "")}"
>

<button
class="remove"
onclick="removeArticle(${index})">
REMOVE ARTICLE
</button>

`;

container.appendChild(card);

});

}


/* ADD ARTICLE */

function addArticle(){

data.articles.push({

title:"New Published Article",

date:"",

image:"",

url:""

});

renderArticles();

window.scrollTo({
top:document.body.scrollHeight,
behavior:"smooth"
});

}


/* REMOVE ARTICLE */

function removeArticle(index){

if(!confirm("Remove this article?")) return;

data.articles.splice(index,1);

renderArticles();

}


/* COLLECT FORM DATA */

function collectData(){

data.name =
document.getElementById("name").value;

data.tagline =
document.getElementById("tagline").value;

data.hero =
document.getElementById("hero").value;

data.about =
document.getElementById("about").value;

data.email =
document.getElementById("email").value;

data.phone =
document.getElementById("phone").value;

data.linkedin =
document.getElementById("linkedin").value;

data.profile =
document.getElementById("profile").value;


/* PROJECTS */

const projectCards =
document.querySelectorAll("#projects .card");

data.projects =
Array.from(projectCards).map(card=>({

title:
card.querySelector(".project-title").value,

category:
card.querySelector(".project-category").value,

desc:
card.querySelector(".project-desc").value,

image:
card.querySelector(".project-image").value,

tags:
card.querySelector(".project-tags").value,

link:
card.querySelector(".project-link").value

}));


/* RESEARCH */

data.research = {

title:
document.getElementById("researchTitle").value,

desc:
document.getElementById("researchDesc").value,

stats:
document.getElementById("researchStats").value,

finding:
document.getElementById("researchFinding").value

};


/* ARTICLES */

const articleCards =
document.querySelectorAll("#articles .card");

data.articles =
Array.from(articleCards).map(card=>({

title:
card.querySelector(".article-title").value,

date:
card.querySelector(".article-date").value,

image:
card.querySelector(".article-image").value,

url:
card.querySelector(".article-url").value

}));

}


/* SAVE */

function savePortfolio(){

collectData();

localStorage.setItem(
KEY,
JSON.stringify(data)
);

const status =
document.getElementById("status");

status.textContent =
"✓ Saved";

setTimeout(()=>{

status.textContent = "";

},3000);

}


/* RESET */

function resetPortfolio(){

if(!confirm(
"Reset portfolio to the original content?"
)) return;

data =
JSON.parse(
JSON.stringify(originalData)
);

localStorage.setItem(
KEY,
JSON.stringify(data)
);

loadBasic();

renderProjects();

loadResearch();

renderArticles();

document.getElementById("status").textContent =
"✓ Reset";

}


/* RESEARCH */

function loadResearch(){

document.getElementById("researchTitle").value =
data.research.title || "";

document.getElementById("researchDesc").value =
data.research.desc || "";

document.getElementById("researchStats").value =
data.research.stats || "";

document.getElementById("researchFinding").value =
data.research.finding || "";

}


/* ESCAPE HTML */

function escapeHTML(value){

return String(value)
.replace(/&/g,"&amp;")
.replace(/</g,"&lt;")
.replace(/>/g,"&gt;")
.replace(/"/g,"&quot;")
.replace(/'/g,"&#039;");

}


/* INITIALIZE */

loadBasic();

loadResearch();

renderProjects();

renderArticles();

</script>

</body>
</html>
